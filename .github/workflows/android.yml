name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # 手动触发：在仓库 Actions 页面点 “Run workflow” 即可。
  # 两个输入项：
  #   build_release —— 是否构建 Release APK（默认开）
  #   unsigned      —— true 产出「真正未签名」的 APK（packageRelease，需自行用
  #                    apksigner/jarsigner 重签后才能安装）；false 用 runner 自动生成的
  #                    debug 密钥签名（即「无自有发布密钥」的 release，可直接侧载安装）。
  # 想让打 tag（如 v1.4.0）时也自动出 release 包，可在此追加：
  #   push:
  #     tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_release:
        description: '构建 Release APK（手动触发时默认构建）'
        type: boolean
        default: true
      unsigned:
        description: 'true=真正未签名(需自行重签才能装)；false=用 debug 密钥签名(可直接侧载)'
        type: boolean
        default: false

# 运行环境大层的来源（仅 release 构建需要）。
# 这些层是上游预编译的二进制（PRoot / DSH），与 fork 的代码改动无关，
# 因此直接复用上游 Release 里已经打好、内嵌进 APK 的那两份：
#   assets/runtime/android-side.tar.zst  —— 宿主侧 PRoot / loader / shmem
#   assets/dsh/*.tar.zst                —— DeepSeek Harness 层
# 注意：dsh 层版本与当前源码树强绑定（v1.4.0 适配 DSH 0.2.0-rc.2），
# 升级 versionName / 换 DSH 版本时务必同步更新 RUNTIME_TAG，否则运行时会不匹配。
env:
  RUNTIME_REPO: WSK-build/DSHBox
  RUNTIME_TAG: v1.4.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # setup-android@v3 的 packages 默认值是 `tools platform-tools`，
      # 而 `tools` 早已从 SDK 仓库移除：新版 runner（cmdline-tools 16）上
      # `sdkmanager tools` 会直接失败退出，CI 连门禁都跑不到。
      # 这里只让它装仍存在的 platform-tools，其余 SDK 包由下一步手动安装。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept licenses & install SDK packages
        run: |
          sdkmanager --update >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission to scripts
        run: chmod +x gradlew tools/*.sh runtime-bundle/scripts/*.sh runtime-bundle/build_rootfs.sh

      # 运行环境大层（runtime/）不在仓库内，CI 不默认拉取；
      # 这里保证 assets.srcDirs 指向的目录存在，避免缺失目录导致装配报错。
      # 不内嵌运行时层的 APK 仍然可用：首启会走「在线获取运行环境」现场组装。
      - name: Ensure runtime assets dir exists
        run: mkdir -p runtime/android-assets

      # 需要 python3 跑隐私审计
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 1.2.1 (P6)：多语言资源键位/占位符 parity + 源码硬编码 CJK 扫描
      - name: Run i18n consistency check
        run: bash tools/i18n_check.sh

      # v1.3.1：官网资源查询串须与 versionName 同步
      # （GitHub Pages 静态资源 max-age=600，漏改会出现「新 HTML + 旧 JS」）
      - name: Check website asset version string
        run: |
          APP_VER=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "versionName=$APP_VER"
          for f in website/index.html website/404.html; do
            [ -f "$f" ] || continue
            vers=$(grep -o 'assets/[^"]*?v=[0-9][^"&]*' "$f" | sed 's/.*?v=//' | sort -u)
            if [ -z "$vers" ]; then
              echo "::error file=$f::未发现 ?v= 版本查询串"
              exit 1
            fi
            for v in $vers; do
              if [ "$v" != "$APP_VER" ]; then
                echo "::error file=$f::?v=$v 与 versionName=$APP_VER 不一致"
                exit 1
              fi
            done
          done
          echo "官网资源版本号已同步"

      # 阻断「本机路径/用户名/凭据」随仓库公开
      # （构建文档曾带着开发机 JDK 路径并进入公开仓库）
      - name: Run privacy audit
        run: python3 tools/privacy_audit.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dshapp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # ===== 获取运行环境大层（仅 release 构建；从上游自包含 APK 提取预编译层） =====
      # 上游 Release 里 android-side 与 dsh 层只随 APK / 离线整包分发，没有单独的
      # 小体积资产；直接下载上游自包含 APK（含这两层），解包取出 assets/runtime/*
      # 与 assets/dsh/* 落到 runtime/android-assets/，即可打出与上游等大的自包含包。
      # 这一步只取运行环境二进制，不取上游 APK 里的 App 代码——App 仍由本 fork 源码编译。
      - name: Fetch & embed runtime layers (release only)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.build_release || inputs.unsigned)
        run: |
          set -euo pipefail
          echo "从 ${RUNTIME_REPO}@${RUNTIME_TAG} 获取预编译运行环境层..."
          # 用 GitHub API 找到自包含 APK 的下载地址（自动适配文件名，无需硬编码）
          APK_URL=$(curl -fsSL "https://api.github.com/repos/${RUNTIME_REPO}/releases/tags/${RUNTIME_TAG}" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print([a['browser_download_url'] for a in d['assets'] if a['name'].endswith('-release.apk')][0])")
          echo "APK: $APK_URL"
          curl -fsSL -L "$APK_URL" -o /tmp/upstream.apk
          echo "已下载: $(du -h /tmp/upstream.apk | cut -f1)"
          # 取出 APK 内嵌的两份运行环境层
          rm -rf /tmp/apkassets && mkdir -p /tmp/apkassets
          unzip -o /tmp/upstream.apk "assets/runtime/*" "assets/dsh/*" -d /tmp/apkassets >/dev/null
          mkdir -p runtime/android-assets/runtime runtime/android-assets/dsh
          cp -r /tmp/apkassets/assets/runtime/. runtime/android-assets/runtime/
          cp -r /tmp/apkassets/assets/dsh/.    runtime/android-assets/dsh/
          echo "已落地运行环境层："
          ls -lhR runtime/android-assets
          # 校验关键文件存在，缺失则明确报错（避免静默打出瘦包）
          test -f runtime/android-assets/runtime/android-side.tar.zst \
            || { echo "::error::缺少 android-side.tar.zst"; exit 1; }
          test -n "$(ls runtime/android-assets/dsh/*.tar.zst 2>/dev/null)" \
            || { echo "::error::缺少 dsh 层"; exit 1; }

      # ===== 手动触发的 Release 构建 =====
      # 仓库内没有发布密钥（keystore.properties / local.properties），
      # app/build.gradle.kts 中 release 构建会回退到 debug 签名配置，
      # 因此 assembleRelease 在 CI 上可直接产出「用 debug 密钥签名的 release」，
      # 也就是用户侧可侧载安装的「未用自有发布密钥签名」的 release 包。
      - name: Assemble release APK (debug 密钥回退，可直接侧载)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.build_release && !inputs.unsigned
        run: ./gradlew assembleRelease --stacktrace

      # 真正「未签名」的 release：用 packageRelease 产出未签名 APK。
      # 注意：Android 不允许安装完全未签名的 APK，该产物需自行用
      #   $ANDROID_HOME/build-tools/36.0.0/apksigner sign --ks my.keystore app-release-unsigned.apk
      # 或 jarsigner 重签后才能装入设备。
      - name: Build unsigned release APK (packageRelease，需自行重签)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.unsigned
        run: ./gradlew packageRelease --stacktrace

      - name: Upload release APK
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.build_release && !inputs.unsigned
        uses: actions/upload-artifact@v4
        with:
          name: dshapp-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload unsigned release APK
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.unsigned
        uses: actions/upload-artifact@v4
        with:
          name: dshapp-release-unsigned-apk
          path: app/build/outputs/apk/release/**/*unsigned*.apk
