name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # 手动触发：在仓库 Actions 页面点 “Run workflow” 即可。
  # 三个输入项：
  #   build_release  —— 是否构建 Release APK（默认开）
  #   self_contained —— 是否内嵌运行环境大层（base/node/android-side/dsh），默认开。
  #                     true = 真正开箱即用：首启无需联网，直接离线装配出完整运行环境；
  #                     false = 瘦包：首启需联网“在线获取运行环境”或离线导入整包。
  #   unsigned      —— true 产出「真正未签名」的 APK（packageRelease，需自行用
  #                    apksigner/jarsigner 重签后才能安装）；false 用 runner 自动生成的
  #                    debug 密钥签名（即「无自有发布密钥」的 release，可直接侧载安装）。
  # 想让打 tag（如 v1.4.0）时也自动出 release 包，可在此追加：
  #   push:
  #     tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_release:
        description: '构建 Release APK（手动触发时默认构建）'
        type: boolean
        default: true
      self_contained:
        description: '自包含(开箱即用)：内嵌 base/node/android-side/dsh，首启无需联网'
        type: boolean
        default: true
      unsigned:
        description: 'true=真正未签名(需自行重签才能装)；false=用 debug 密钥签名(可直接侧载)'
        type: boolean
        default: false

# ===================== 运行环境大层的【正规来源】=====================
# 这些层（base/node/android-side/dsh）是上游预编译的二进制，与 fork 的代码改动无关，
# 因此直接复用上游官方 Release 已发布的版本。来源锁定规则：
#   1. RUNTIME_REPO = WSK-build/DSHBox —— 本项目实际发布构建的组织（app 内置更新检查也
#      指向 api.github.com/repos/WSK-build/DSHBox/releases/latest），即“正规来源”，
#      不是随便一个仓库。你自己的 fork 也发布带这些层的 Release 后，把这里改回自己即可。
#   2. RUNTIME_TAG / BUNDLE_BASENAME / DSH_LAYER_NAME 精确锁定版本与资产名，不拼接任意 URL。
#   3. 下载走 https://github.com/<官方仓库>/releases/download/<Tag>/<资产名>，全程 TLS。
#   4. 双层完整性校验：
#      (a) 外层 SHA-256 钉（BUNDLE_SHA256 / DSH_LAYER_SHA256，见下）——首次成功构建后
#          运行 sha256sum 把值填进来，此后每次构建都会比对，防来源被替换/投毒；留空则跳过。
#      (b) App 首启时会按官方整包内【自带的每层 .sha256】逐项校验 base/node/android-side，
#          确认字节级与上游发布一致（与 BUNDLE_SHA256 互补，不依赖你手动钉值）。
# 注意版本强绑定：v1.4.0 适配 DSH 0.2.0-rc.2 / 离线整包 0.1.0。升级 versionName 或换 DSH
# 版本时，必须同步更新 RUNTIME_TAG、BUNDLE_BASENAME、DSH_LAYER_NAME，否则运行时会报层不匹配。
env:
  RUNTIME_REPO: WSK-build/DSHBox
  RUNTIME_TAG: v1.4.0
  # 离线整包：含 base.tar.zst / node.tar.zst / android-side.tar.zst + 各自 .sha256 + runtime-profile.json
  BUNDLE_BASENAME: dshapp-runtime-debian-arm64-0.1.0
  # DSH 层（独立的官方 Release 资产）
  DSH_LAYER_NAME: 0.2.0-rc.2.tar.zst
  # 外层 SHA-256 钉（防御性，可选）。留空=跳过外层校验。首次成功构建后执行：
  #   sha256sum 下载得到的 dshapp-runtime-debian-arm64-0.1.0.zip
  #   sha256sum 下载得到的 0.2.0-rc.2.tar.zst
  # 把输出填入下面两项，以后 CI 每次都会比对，防止官方资产被替换或中间人篡改。
  BUNDLE_SHA256: ""
  DSH_LAYER_SHA256: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # setup-android@v3 的 packages 默认值是 `tools platform-tools`，
      # 而 `tools` 早已从 SDK 仓库移除：新版 runner（cmdline-tools 16）上
      # `sdkmanager tools` 会直接失败退出，CI 连门禁都跑不到。
      # 这里只让它装仍存在的 platform-tools，其余 SDK 包由下一步手动安装。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept licenses & install SDK packages
        run: |
          sdkmanager --update >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # 给脚本加执行权限（runtime-bundle 不在仓库内时跳过，避免报错）
      - name: Grant execute permission to scripts
        run: |
          chmod +x gradlew tools/*.sh 2>/dev/null || true
          chmod +x runtime-bundle/scripts/*.sh runtime-bundle/build_rootfs.sh 2>/dev/null || true

      # 运行环境大层（runtime/）不在仓库内，CI 不默认拉取；
      # 这里保证 assets.srcDirs 指向的目录存在，避免缺失目录导致装配报错。
      - name: Ensure runtime assets dir exists
        run: mkdir -p runtime/android-assets/runtime runtime/android-assets/dsh

      # 需要 python3 跑隐私审计
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 1.2.1 (P6)：多语言资源键位/占位符 parity + 源码硬编码 CJK 扫描
      - name: Run i18n consistency check
        run: bash tools/i18n_check.sh

      # v1.3.1：官网资源查询串须与 versionName 同步
      # （GitHub Pages 静态资源 max-age=600，漏改会出现「新 HTML + 旧 JS」）
      - name: Check website asset version string
        run: |
          APP_VER=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "versionName=$APP_VER"
          for f in website/index.html website/404.html; do
            [ -f "$f" ] || continue
            vers=$(grep -o 'assets/[^"]*?v=[0-9][^"&]*' "$f" | sed 's/.*?v=//' | sort -u)
            if [ -z "$vers" ]; then
              echo "::error file=$f::未发现 ?v= 版本查询串"
              exit 1
            fi
            for v in $vers; do
              if [ "$v" != "$APP_VER" ]; then
                echo "::error file=$f::?v=$v 与 versionName=$APP_VER 不一致"
                exit 1
              fi
            done
          done
          echo "官网资源版本号已同步"

      # 阻断「本机路径/用户名/凭据」随仓库公开
      # （构建文档曾带着开发机 JDK 路径并进入公开仓库）
      - name: Run privacy audit
        run: python3 tools/privacy_audit.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dshapp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # ===== 获取并内嵌运行环境大层（仅 release 且 self_contained）=====
      # 来源：上游官方 Release（RUNTIME_REPO@RUNTIME_TAG），含：
      #   · 离线整包 ${BUNDLE_BASENAME}.zip —— base/node/android-side 三层 + 每层 .sha256 + runtime-profile.json
      #   · DSH 层 ${DSH_LAYER_NAME}            —— DeepSeek Harness 层
      # 下载后：
      #   · 外层 SHA-256（若已钉死）比对，防来源被替换；
      #   · 解包离线整包，定位三层 + profile + 各自 .sha256（兼容扁平 / runtime/ 前缀两种官方布局），
      #     扁平化拷入 runtime/android-assets/runtime/ → 打包后成为 assets/runtime/*；
      #   · DSH 层直接拷入 runtime/android-assets/dsh/ → 打包后成为 assets/dsh/*。
      # 这一步只取运行环境二进制，不取上游 APK 里的 App 代码——App 始终由本 fork 源码编译。
      # 首启时 App 会：BundledRuntimeInstaller 装配 base/node/android-side，
      # provisionBundledDsh 装配 DSH —— 全程离线，无需联网。
      - name: Fetch & embed runtime layers (official release, self-contained)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.build_release || inputs.unsigned) &&
          inputs.self_contained
        run: |
          set -euo pipefail
          WORK=runtime/android-assets
          TMP=$(mktemp -d)
          echo "运行环境大层来源（正规）：${RUNTIME_REPO}@${RUNTIME_TAG}"

          # ---- 1) 官方离线整包（base/node/android-side + 各自 .sha256 + profile）----
          BUNDLE_URL="https://github.com/${RUNTIME_REPO}/releases/download/${RUNTIME_TAG}/${BUNDLE_BASENAME}.zip"
          echo "下载离线整包：$BUNDLE_URL"
          curl -fsSL -L "$BUNDLE_URL" -o "$TMP/bundle.zip"
          echo "已下载离线整包: $(du -h "$TMP/bundle.zip" | cut -f1)"

          if [ -n "${BUNDLE_SHA256:-}" ]; then
            ACTUAL=$(sha256sum "$TMP/bundle.zip" | cut -d' ' -f1)
            if [ "$ACTUAL" != "$BUNDLE_SHA256" ]; then
              echo "::error::离线整包 SHA-256 不匹配（预期 ${BUNDLE_SHA256}，实际 ${ACTUAL}）"
              exit 1
            fi
            echo "离线整包 SHA-256 校验通过"
          else
            echo "（外层 SHA-256 未钉死，跳过外层校验；App 首启仍会按整包内每层 .sha256 校验）"
          fi

          rm -rf "$TMP/ext" && mkdir -p "$TMP/ext"
          unzip -o "$TMP/bundle.zip" -d "$TMP/ext" >/dev/null

          # 定位三层（兼容 扁平 或 runtime/ 前缀两种官方布局），扁平化拷入 assets/runtime/
          for layer in base node android-side; do
            src=$(find "$TMP/ext" -type f -name "${layer}.tar.*" ! -name '*.sha256' | head -1)
            [ -n "$src" ] || { echo "::error::离线整包缺少 ${layer}.tar.*"; exit 1; }
            cp "$src" "$WORK/runtime/$(basename "$src")"
            # 复制官方自带的每层 .sha256 校验副文件（App 首启会逐项校验，确认字节级与上游一致）
            side=$(find "$TMP/ext" -type f -name "${layer}.tar.*.sha256" | head -1)
            [ -n "$side" ] && cp "$side" "$WORK/runtime/$(basename "$side")"
            echo "  + $(basename "$src")"
          done
          prof=$(find "$TMP/ext" -type f -name 'runtime-profile.json' | head -1)
          [ -n "$prof" ] || { echo "::error::离线整包缺少 runtime-profile.json"; exit 1; }
          cp "$prof" "$WORK/runtime/runtime-profile.json"
          echo "  + runtime-profile.json"

          # ---- 2) 官方 DSH 层（独立资产）----
          DSH_URL="https://github.com/${RUNTIME_REPO}/releases/download/${RUNTIME_TAG}/${DSH_LAYER_NAME}"
          echo "下载 DSH 层：$DSH_URL"
          curl -fsSL -L "$DSH_URL" -o "$WORK/dsh/${DSH_LAYER_NAME}"
          echo "已下载 DSH 层: $(du -h "$WORK/dsh/${DSH_LAYER_NAME}" | cut -f1)"
          if [ -n "${DSH_LAYER_SHA256:-}" ]; then
            ACTUAL=$(sha256sum "$WORK/dsh/${DSH_LAYER_NAME}" | cut -d' ' -f1)
            if [ "$ACTUAL" != "$DSH_LAYER_SHA256" ]; then
              echo "::error::DSH 层 SHA-256 不匹配"; exit 1
            fi
            echo "DSH 层 SHA-256 校验通过"
          else
            echo "（DSH 外层 SHA-256 未钉死，跳过外层校验；下载走官方 Release TLS）"
          fi

          rm -rf "$TMP"
          echo "已落地运行环境层："
          ls -lhR "$WORK"

          # 关键文件存在性校验，缺失则明确报错（避免静默打出瘦包）
          test -f "$WORK/runtime/base.tar.zst" -a -f "$WORK/runtime/node.tar.zst" \
               -a -f "$WORK/runtime/android-side.tar.zst" -a -f "$WORK/runtime/runtime-profile.json" \
            || { echo "::error::运行环境层(base/node/android-side/profile)缺失"; exit 1; }
          test -f "$WORK/dsh/${DSH_LAYER_NAME}" \
            || { echo "::error::DSH 层缺失"; exit 1; }

      # ===== 手动触发的 Release 构建 =====
      # 仓库内没有发布密钥（keystore.properties / local.properties），
      # app/build.gradle.kts 中 release 构建会回退到 debug 签名配置，
      # 因此 assembleRelease 在 CI 上可直接产出「用 debug 密钥签名的 release」，
      # 也就是用户侧可侧载安装的「未用自有发布密钥签名」的 release 包。
      - name: Assemble release APK (debug 密钥回退，可直接侧载)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.build_release && !inputs.unsigned
        run: ./gradlew assembleRelease --stacktrace

      # 真正「未签名」的 release：用 packageRelease 产出未签名 APK。
      # 注意：Android 不允许安装完全未签名的 APK，该产物需自行用
      #   $ANDROID_HOME/build-tools/36.0.0/apksigner sign --ks my.keystore app-release-unsigned.apk
      # 或 jarsigner 重签后才能装入设备。
      - name: Build unsigned release APK (packageRelease，需自行重签)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.unsigned
        run: ./gradlew packageRelease --stacktrace

      - name: Upload release APK
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.build_release && !inputs.unsigned
        uses: actions/upload-artifact@v4
        with:
          name: dshapp-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload unsigned release APK
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.unsigned
        uses: actions/upload-artifact@v4
        with:
          name: dshapp-release-unsigned-apk
          path: app/build/outputs/apk/release/**/*unsigned*.apk
